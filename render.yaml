services:
  # PostgreSQL Database
  - type: pserv
    name: tel-agent-db
    env: postgres
    plan: free
    databaseName: telagent
    postgresVersion: 16

  # API Service
  - type: pserv
    name: tel-agent-api
    env: docker
    plan: free
    dockerfilePath: ./docker/api.Dockerfile
    dockerContext: .
    envVars:
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tel-agent-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://tel-agent-web.onrender.com
      - key: TRUSTED_HOSTS
        value: localhost,127.0.0.1,tel-agent-api.onrender.com
      - key: BIND_HOST
        value: 0.0.0.0
      - key: BIND_PORT
        value: 38472

  # Web Service (Next.js)
  - type: pserv
    name: tel-agent-web
    env: docker
    plan: free
    dockerfilePath: ./docker/web.Dockerfile
    dockerContext: .
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://tel-agent-api.onrender.com
