version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: laxalab-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-laxalab_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SuperSecretPassword123!}
      POSTGRES_DB: ${DB_NAME:-laxalab_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - laxalab_network

volumes:
  postgres_data:
    name: laxalab_postgres_data

networks:
  laxalab_network:
    name: laxalab_network
    driver: bridge
