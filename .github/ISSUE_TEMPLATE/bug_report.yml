name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Never include an API key, a SIP password, a real recording, or a real
        transcript.** Redact phone numbers before pasting logs.

        Security problem? Do not file it here — see SECURITY.md.

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or errors
      description: Redact credentials and phone numbers first.
      render: shell

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. main @ e9f36d4
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part?
      options:
        - agent (SIP, audio, the call itself)
        - api
        - web
        - documentation or specification
        - not sure
    validations:
      required: true

  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: >-
        OS and Python version. If it involves calls: which PBX, which providers, and
        whether the machine is on the same LAN as the PBX.
      placeholder: |
        OS:
        Python:
        PBX:
        STT / LLM / TTS:
        Same LAN as PBX: yes / no
    validations:
      required: true

  - type: checkboxes
    id: audio
    attributes:
      label: If there is no audio on the call
      options:
        - label: >-
            I have read the deployment notes on RTP port ranges and external_ip. Most
            "the call connects but there is no audio" reports trace to those.
