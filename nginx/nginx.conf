worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Basic Settings
    sendfile on;
    keepalive_timeout 65;
    
    # Security Headers
    server_tokens off;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # SSL Settings Placeholder (For Let's Encrypt / Certbot)
    # ssl_certificate /etc/letsencrypt/live/domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/domain.com/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_prefer_server_ciphers on;

    server {
        listen 80;
        # Update both server_name lines to your actual domain
        server_name yourdomain.com www.yourdomain.com;

        # Increase body size for receipt/file uploads
        client_max_body_size 12M;

        # Serve Certbot challenges
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect HTTP to HTTPS (Uncomment after SSL is configured)
        # location / {
        #     return 301 https://$host$request_uri;
        # }

        # --- Remove the block below after SSL is configured ---
        location /api/ {
            proxy_pass http://backend:3000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend:3000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # --------------------------------------------------------
    }

    # HTTPS Server Setup (Uncomment and configure after Certbot runs)
    # server {
    #     listen 443 ssl;
    #     server_name yourdomain.com www.yourdomain.com;
    #     
    #     client_max_body_size 12M;
